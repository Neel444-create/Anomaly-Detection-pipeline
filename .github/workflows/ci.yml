name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Check lint rules
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run test suite
        run: pytest -q

      - name: Run data-pipeline tests
        run: pytest -q tests/test_data.py

  docker:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Create CI-only serving artifact
        run: |
          mkdir -p models
          touch models/best_model.joblib
          echo '{"source":"CI-only placeholder artifact; not a production model."}' > models/best_model_metadata.json

      - name: Build inference image
        run: docker build --tag financial-anomaly-api:ci .
